    time: 2026
    company: Navis — AI 기반 시각장애인 반자율 보행 보조 시스템
    details: |
      카메라 인식 결과를 바탕으로 모터 조향 토크로 보행 방향을 유도하는 장치 개발.
        - 프로젝트 총괄, 모터 구동·조향 제어, 회로 설계 및 하드웨어 제작
        - ESP32에서 BLE·UART·PWM 통합, 장애물/신호/횡단보도/길안내 제어 우선순위 설계
        - 결과: 【수상 내역이 있다면 기재】

  - role: 펌웨어·엣지 담당 · 2026 SSG-SSAC 해커톤
    time: 2026
    company: Bootivation — 무인매장 고객·배달기사 검증 시스템
    details: |
      Vision·POS·트레이·배달 안내 장치를 하나의 상태머신으로 통합한 멀티 디바이스 시스템.
        - ATmega128 POS: 기존 어셈블리를 분석해 기능별 C 모듈로 재구성
        - 초음파·IR·터치·조이스틱 입력, LCD·FND 출력, UART CSV 프로토콜 설계
        - Raspberry Pi 5 HSV 기반 트레이 상품 분류 및 음성 안내

